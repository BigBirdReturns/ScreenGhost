name: DTI cartridge

on:
  pull_request:
    paths:
      - ".github/workflows/dti-cartridge.yml"
      - "configs/dti/**"
      - "docs/DTI_*"
      - "experiments/dti/**"
      - "requirements-dti.txt"
      - "tests/dti/**"
      - "scripts/dti/**"
      - "*_DTI.cmd"
  push:
    branches:
      - agent/dti-cartridge-v0
    paths:
      - ".github/workflows/dti-cartridge.yml"
      - "configs/dti/**"
      - "docs/DTI_*"
      - "experiments/dti/**"
      - "requirements-dti.txt"
      - "tests/dti/**"
      - "scripts/dti/**"
      - "*_DTI.cmd"

permissions:
  contents: read

concurrency:
  group: dti-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-floor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install cartridge dependencies
        run: python -m pip install -r requirements-dti.txt
      - name: Compile cartridge
        run: python -m compileall -q experiments/dti
      - name: Run deterministic tests
        run: python -m pytest tests/dti -q
      - name: Validate example profile
        run: python -m experiments.dti validate-profile configs/dti/profile.example.json
      - name: Prove OCR-degraded theme resolution
        run: python -m experiments.dti resolve-theme Victoran
